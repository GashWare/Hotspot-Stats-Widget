[package]
name = "hotspot_stats_widget"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.35.0"
sysinfo = "0.38.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
